<head>

  <meta name="description" content="BariTotalCare by Bariatric Centers of America. From the first ad click to long-term follow-up, one integrated bariatric CRM platform." />
  <link rel="icon" type="image/png" href="./brand-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --denim: #323f4e;
      --hunter: #27423e;
      --teal: #447073;
      --ocean: #7dbdb6;
      --mist: #a8c7ca;
      --coral: #dd5b57;
      --midnight: #1c1e1d;
      --charcoal: #3d3d3d;
      --dove: #d8dadb;
      --stone: #ededed;
      --white: #ffffff;
      --display: "Canela", "Cormorant Garamond", serif;
      --body: "Euclid", "Euclid Circular A", "Manrope", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(125, 189, 182, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(221, 91, 87, 0.12), transparent 26%),
        linear-gradient(180deg, #f8f6f2 0%, #f0ece5 100%);
      color: var(--charcoal);
      font-family: var(--body);
    }
    button { font: inherit; }
    a { font: inherit; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50%       { transform: translate3d(0, -14px, 0); }
    }
  </style>
</head>

    const PRODUCTS = [

    // ── Shared Components ────────────────────────────────────────────────

      return (

    // ── Marketing Case Study View ────────────────────────────────────────
    function MarketingCaseView({ isMobile, isTablet }) {
      const maxW = { maxWidth: 1240, margin: "0 auto" };

      const sLabel = { fontSize: 12, fontWeight: 800, letterSpacing: "0.18em", textTransform: "uppercase", color: COLORS.teal, marginBottom: 12 };
      const sHead  = { fontFamily: FONT_DISPLAY, fontSize: "clamp(30px, 4.5vw, 48px)", fontWeight: 700, color: COLORS.denim, lineHeight: 0.95, letterSpacing: "-0.04em", marginBottom: 16, marginTop: 0 };

      const thS = { background: COLORS.denim, color: COLORS.white, fontWeight: 800, fontSize: 11.5, textTransform: "uppercase", letterSpacing: "0.08em", padding: "8px 10px", textAlign: "left", borderBottom: "none" };

      const tdNum = { ...tdS, textAlign: "right", fontVariantNumeric: "tabular-nums" };

      const bThS = { background: COLORS.denim, color: COLORS.white, fontWeight: 800, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.12em", padding: "18px 24px", textAlign: "left" };
      const bTdS = { padding: "18px 24px", borderBottom: `1px solid rgba(50,63,78,0.08)`, verticalAlign: "middle", color: COLORS.charcoal };

      const metricsData = [
        { number: "$24.72", label: ["Blended CPL", "vs. $80–$200+ Industry"] },
        { number: "22.9%",  label: ["Google Search Conv Rate", "vs. 3–8% Industry"] },
        { number: "$0.01",  label: ["ThruPlay Cost per View", "vs. $0.15–$0.30 Industry"] },
        { number: "2",      label: ["Practices, 2 States", "Surgery-Only & Hybrid"] },
      ];

      function CaseCard({ badge, badgeColor, badgeBg, title, location, stats, tables, totals }) {
        return (
          <div style={{ background: "rgba(255,255,255,0.72)", border: "1px solid rgba(50,63,78,0.08)", borderRadius: 28, overflow: "hidden", boxShadow: SHADOW_SM }}>
            <div style={{ padding: isMobile ? "24px" : "32px 32px 24px", borderBottom: `1px solid ${COLORS.dove}` }}>
              <span style={{ display:"inline-block", fontSize:11, fontWeight:800, letterSpacing:"0.12em", textTransform:"uppercase", padding:"6px 14px", borderRadius:999, marginBottom:16, background: badgeBg, color: badgeColor }}>{badge}</span>

              <div style={{ fontSize: 14, color: COLORS.charcoal }}>{location}</div>
            </div>
            <div style={{ padding: isMobile ? "24px" : "28px 32px 32px" }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 28 }}>

                  <div key={s.value} style={{ background: COLORS.shell, border: "1px solid rgba(68,112,115,0.1)", borderRadius: 22, padding: "18px 16px" }}>
                    <div style={{ fontFamily: FONT_DISPLAY, fontSize: 28, fontWeight: 700, color: COLORS.hunter, lineHeight: 1.1, letterSpacing: "-0.03em" }}>{s.value}</div>
                    <div style={{ fontSize: 13, color: COLORS.charcoal, marginTop: 6, lineHeight: 1.45 }}>{s.desc}</div>

              {tables.map(t => (
                <div key={t.label}>
                  <div style={{ fontSize:12, fontWeight:800, letterSpacing:"0.15em", textTransform:"uppercase", color:COLORS.denim, marginBottom:10, marginTop:4 }}>{t.label}</div>

          {/* ── Practice Spotlights ── */}

            <div style={maxW}>

              <h2 style={sHead}>Real Results From Real Programs</h2>

                  stats={[
                    { value:"36",     desc:"Total leads in one week" },

                    { value:"$3.92",  desc:"Google CPC (vs. $8–$18 industry)" },

                  ]}
                  tables={[
                    { label:"Meta Ads — Lead Campaigns", cols:["Campaign","Leads","CPL","Spend"], rows:[
                      ["Affordable Self-Pay","14","$8.59","$120.29"],
                      ["GLP-1 Side Effects","1","$27.92","$27.92"],

                    { value:"$0.01",  desc:"ThruPlay cost per view" },
                    { value:"24,987", desc:"Total ThruPlay video views" },

          {/* ── Benchmark Section ── */}
          <div style={{ background:COLORS.stone, padding: isMobile ? "56px 24px" : "80px 24px" }}>
            <div style={maxW}>
              <div style={sLabel}>Performance vs. Industry</div>
              <h2 style={sHead}>Outperforming Every Key Benchmark</h2>

                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", fontSize:15, minWidth: isMobile ? 580 : "auto" }}>

                          <th key={h} style={{ ...bThS, textAlign: i === 3 ? "center" : "left" }}>{h}</th>

                    </thead>
                    <tbody>
                      {[
                        ["Healthcare Meta CPL",               "$41–$52",      "$8.56–$23.24",   "56–85% lower"],
                        ["Bariatric Surgery Meta CPL",        "$80–$200+",    "$8.59–$33.23",   "58–96% lower"],
                        ["Bariatric Google Search CPL",       "$150–$350",    "$22.48–$36.55",  "76–94% lower"],

                        <tr key={metric} style={{ background: ri % 2 === 0 ? "transparent" : "rgba(125,189,182,0.04)" }}>
                          <td style={{ ...bTdS, fontWeight:600, color:COLORS.denim }}>{metric}</td>
                          <td style={{ ...bTdS, opacity:0.7 }}>{ind}</td>
                          <td style={{ ...bTdS, fontWeight:700, color:COLORS.hunter }}>{ours}</td>
                          <td style={{ ...bTdS, textAlign:"center" }}>
                            <span style={{ display:"inline-block", background:"rgba(39,66,62,0.09)", color:COLORS.hunter, fontSize:13, fontWeight:800, padding:"6px 14px", borderRadius:999, whiteSpace:"nowrap" }}>{imp}</span>

            </div>
          </div>

          {/* ── Strategy Section ── */}
          <div style={{ padding: isMobile ? "56px 24px" : "80px 24px" }}>
            <div style={maxW}>
              <div style={sLabel}>The BariLead Strategy</div>
              <h2 style={sHead}>A Three-Phase Approach That Compounds</h2>
              <p style={sSub}>Our methodology uses top-of-funnel video conditioning to drive down cost-per-lead across every platform — creating a self-reinforcing growth loop.</p>

                      <div key={feature} style={{ display:"flex", gap:14, alignItems:"flex-start", padding:"18px", borderRadius:22, background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.08)" }}>

                      </div>

                  </div>
                </div>
                <div style={{ marginTop:22, display:"flex", flexWrap:"wrap", justifyContent:"space-between", gap:14 }}>
                  <button
                    onClick={() => { const ci = PRODUCTS.findIndex(p => p.id === active.id); if(ci > 0) navigateTo("detail", PRODUCTS[ci-1]); }}

                    style={{ border:`1px solid ${COLORS.denim}20`, background:"rgba(255,255,255,0.82)", color: PRODUCTS[0].id === active.id ? "rgba(50,63,78,0.38)" : COLORS.denim, borderRadius:999, padding:"12px 18px", fontSize:13, fontWeight:800, cursor: PRODUCTS[0].id === active.id ? "default" : "pointer" }}

                    onClick={() => { const ci = PRODUCTS.findIndex(p => p.id === active.id); if(ci < PRODUCTS.length-1) navigateTo("detail", PRODUCTS[ci+1]); else navigateTo("overview"); }}
                    style={{ border:"none", background:COLORS.coral, color:COLORS.white, borderRadius:999, padding:"12px 18px", fontSize:13, fontWeight:800, cursor:"pointer", boxShadow:"0 14px 30px rgba(221,91,87,0.24)" }}

                </div>
              </section>

            {view === "marketingCase" && <MarketingCaseView isMobile={isMobile} isTablet={isTablet} />}

          </main>

          {/* ── Consistent Footer ── */}
